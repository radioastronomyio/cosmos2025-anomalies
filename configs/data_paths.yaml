# COSMOS2025 Data Paths Configuration
#
# All paths are ML01-relative unless noted. Inspection, ETL, and analysis
# code load this file rather than hardcoding paths.
#
# Database credentials: injected from Doppler project `ml01`, config `dev`,
# and not stored here. See the "database" section for env var names.
#
# Path-existence contract: every local filesystem path below exists on disk
# at spec P2R-01 gate 1.5. Two annotated exemptions:
#   - processed/ dirs are created on demand by a future pipeline run
#   - external_holdings/ is off-box (host:path on the storage server)

# ---------------------------------------------------------------------------
# Data root on ML01 NVMe (COSMOS-Web DR1 v1.1 holdings; raw and immutable)
# ---------------------------------------------------------------------------
data_root: /mnt/nvme01/cosmos-web-dr1-catalog

catalogs:
  # v1.1 master catalog and per-extension products (Shuntov et al. 2025, v1.1)
  master_catalog: /mnt/nvme01/cosmos-web-dr1-catalog/COSMOSWeb_mastercatalog_v1.1.fits
  photom_primary: /mnt/nvme01/cosmos-web-dr1-catalog/COSMOSWeb_mastercatalog_v1.1_photom_primary.fits
  photom_secondary: /mnt/nvme01/cosmos-web-dr1-catalog/COSMOSWeb_mastercatalog_v1.1_photom_secondary.fits
  lephare: /mnt/nvme01/cosmos-web-dr1-catalog/COSMOSWeb_mastercatalog_v1.1_lephare.fits
  cigale: /mnt/nvme01/cosmos-web-dr1-catalog/COSMOSWeb_mastercatalog_v1.1_cigale.fits
  bulgedisk: /mnt/nvme01/cosmos-web-dr1-catalog/COSMOSWeb_mastercatalog_v1.1_bulgedisk.fits
  galight_morph: /mnt/nvme01/cosmos-web-dr1-catalog/COSMOSWeb_mastercatalog_v1.1_galight_morph.fits
  ml_morph: /mnt/nvme01/cosmos-web-dr1-catalog/COSMOSWeb_mastercatalog_v1.1_ml_morph.fits
  agngal_desi: /mnt/nvme01/cosmos-web-dr1-catalog/agngal_desi.fits
  pdfz_pickle: /mnt/nvme01/cosmos-web-dr1-catalog/COSMOSWeb-LePhare-PDFz_v1.1.pkl
  lephare_seds_h5: /mnt/nvme01/cosmos-web-dr1-catalog/COSMOSWeb-LePhare-SEDs_v1.1.h5
  detection_images_dir: /mnt/nvme01/cosmos-web-dr1-catalog/detection_images

supplementary:
  # Named supplement files only; discovery must not select any other file
  lss_overdensity: /mnt/nvme01/cosmos-web-dr1-catalog/hatamnia-lss/hatamnia-lss-catalog.fits
  lss_readme: /mnt/nvme01/cosmos-web-dr1-catalog/hatamnia-lss/readme.txt
  group_catalog_groups: /mnt/nvme01/cosmos-web-dr1-catalog/toni/groups.txt
  group_catalog_memberships: /mnt/nvme01/cosmos-web-dr1-catalog/toni/memberships.txt

specz:
  # Khostovan et al. spec-z compilation checkout (git, LFS-backed).
  # The local FITS/PKL holdings are materialized. Gate 3.5 SHA-256-pinned the
  # exact unique FITS consumed by the verified Gate 3.8 load; this records
  # observed local state and does not claim a remote or LFS operation.
  # P2R-04 gate 4.1 added the measurement-level artifact and manifest pins it
  # separately; both files are distinct upstream products.
  compilation_root: /opt/agents/repos/reference-files/speczcompilation
  unique_fits: /opt/agents/repos/reference-files/speczcompilation/specz_compilation/specz_compilation_COSMOS_DR1.1_unique.fits
  all_fits: /opt/agents/repos/reference-files/speczcompilation/specz_compilation/specz_compilation_COSMOS_DR1.1_all.fits

# ETL output directories (repo-local; created on demand by a future approved
# pipeline run and exempt from the local exists-check; nothing may write
# under data_root)
processed:
  parquet_dir: /opt/agents/repos/cosmos2025-anomalies/staging/parquet
  derived_dir: /opt/agents/repos/cosmos2025-anomalies/staging/derived
  staging_dir: /opt/agents/repos/cosmos2025-anomalies/staging

# Repository data products built deterministically from the immutable sources.
dictionary:
  columns_v11: /opt/agents/repos/cosmos2025-anomalies/data/dictionary/columns-v11.csv
  schema_v11_sql: /opt/agents/repos/cosmos2025-anomalies/src/etl/schema_v11.sql
  schema_v11_docs: /opt/agents/repos/cosmos2025-anomalies/docs/reference/schema-v11.md
  conformance_cases_v11: /opt/agents/repos/cosmos2025-anomalies/src/etl/conformance_cases_v11.py
  sentinel_candidates_v11: /opt/agents/repos/cosmos2025-anomalies/docs/reference/sentinel-candidates-v11.md

# Pinned semantic evidence consumed read-only by the load-dictionary builder.
# The Yang PDF cache is outside the repository and immutable source-data root.
semantic_sources:
  master_descriptions: /mnt/nvme01/cosmos-web-dr1-catalog/cosmosweb-dr1-detailed-column-descriptions.txt
  yang_v1_pdf: /opt/agents/cache/cosmos2025/references/yang-2026-arxiv-2606.14869v1.pdf
  lss_readme: /mnt/nvme01/cosmos-web-dr1-catalog/hatamnia-lss/readme.txt
  specz_root_readme: /opt/agents/repos/reference-files/speczcompilation/README.md
  specz_schema_readme: /opt/agents/repos/reference-files/speczcompilation/specz_compilation/README.md
  unit_conventions: /opt/agents/repos/cosmos2025-anomalies/docs/reference/unit-conventions.md
  etl_v2_spec: /opt/agents/repos/spec/2026-08-16-cosmos2025-spec-p2r-03-etl-v2-mirror.md

# Existing immutable-source pins consumed read-only by ETL v2 preflight.
# Gate 3.5 validates these files but never regenerates or replaces them.
provenance:
  source_manifest_v11: /opt/agents/repos/cosmos2025-anomalies/docs/reference/data-manifest-v1.1.csv
  cigale_seds_aggregate_pin: /opt/agents/repos/cosmos2025-anomalies/docs/reference/data-manifest-v1.1-cigale-seds.csv

# Tracked-only inputs and output for the offline Gate 3.13 approval surface.
verification_surface:
  cumulative_worklog: /opt/agents/repos/cosmos2025-anomalies/work-logs/2026-08-16-cosmos2025-worklog-p2r-03-etl-v2-mirror.md
  science_opportunities: /opt/agents/repos/cosmos2025-anomalies/docs/research/science-opportunities.md
  research_index: /opt/agents/repos/cosmos2025-anomalies/docs/research/README.md
  central_spec_archive: /opt/agents/repos/spec/2026-08/2026-08-16-cosmos2025-spec-p2r-03-etl-v2-mirror.md
  output: /opt/agents/repos/cosmos2025-anomalies/docs/research/etl-v2-verification.md

# P2R-04 spec-z linkage verification evidence (staging is gitignored; the
# committed worklog and review surface carry the observed numbers).
specz_linkage:
  evidence_dir: /opt/agents/repos/cosmos2025-anomalies/staging
  gate_4_1_evidence: /opt/agents/repos/cosmos2025-anomalies/staging/specz-linkage-g41-evidence.json

# ---------------------------------------------------------------------------
# Database (psql01)
# ---------------------------------------------------------------------------
database:
  # Bootstrap and verification transport only. Runtime consumers use the
  # database-specific read-only contract below after operator cutover.
  host_env: PGSQL01_HOST          # 10.25.20.8
  port_env: PGSQL01_PORT          # 5432
  user_env: PGSQL01_ADMIN_USER
  password_env: PGSQL01_ADMIN_PASSWORD
  maintenance_database: postgres
  scratch_prefix: cosmos2025_v11_scratch_
  database_name: cosmos2025
  schema: catalog
  target_database: cosmos2025_v11
  analyst_role: cosmos2025_v11_ro

  # Retired source-of-truth database retained as a named read-only baseline.
  baseline_v1:
    database_name: cosmos2025
    schema: catalog
    access: read_only

  # Runtime ETL v2 contract. Direct ML01 analyst HBA coverage remains a
  # pending operator action; these are names only, never credential values.
  runtime_v11:
    host_env: PGSQL01_HOST
    port_env: PGSQL01_PORT
    database_env: PGSQL01_COSMOS2025_V11_DB
    user_env: PGSQL01_COSMOS2025_V11_USER
    password_env: PGSQL01_COSMOS2025_V11_PASSWORD
    database_name: cosmos2025_v11
    schema: source
    access: read_only

  # Inject credentials through the ML01 scoped runtime:
  #   doppler run --project ml01 --config dev -- python your_script.py
  #
  # Python reads the injected values from os.environ by the names above.

# ---------------------------------------------------------------------------
# ETL v2 Gate 3.7 persistent bootstrap
# ---------------------------------------------------------------------------
etl_v2:
  # COPY frames stay bounded in memory; each master table commits separately.
  copy_batch_rows: 2000
  # Halt before target creation unless the PostgreSQL data volume has 50 GiB free.
  minimum_database_free_bytes: 53687091200

# ---------------------------------------------------------------------------
# ETL v2 Gate 3.11 read-only reconciliation
# ---------------------------------------------------------------------------
reconciliation:
  sample_rows: 20000
  wide_batch_rows: 500
  batch_rows: 2000
  mismatch_ledger: /opt/agents/repos/cosmos2025-anomalies/.superpowers/sdd/2026-08-16-cosmos2025-spec-p2r-03-etl-v2-mirror/gate-3-11-mismatches.jsonl

handoff:
  # Created once with O_EXCL and mode 0600 after load and role checks succeed.
  cosmos2025_v11_env: /opt/agents/repos/cosmos2025-anomalies/internal-files/cosmos2025-v11.env

# ---------------------------------------------------------------------------
# Off-box holdings (storage server; NOT local paths, exempt from the
# local exists-check)
# ---------------------------------------------------------------------------
external_holdings:
  cigale_seds_root:
    host: vps3557752
    path: /opt/agents/repos/cosmosweb2025-data/CIGALE_SEDs_v1/
    note: ~175 GB CIGALE per-source best-model SEDs; download deferred;
      per-source lookup only after candidate triage, never bulk-loaded

# ---------------------------------------------------------------------------
# Repository location on ML01
# ---------------------------------------------------------------------------
repo_root: /opt/agents/repos/cosmos2025-anomalies
